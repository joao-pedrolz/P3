<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
</head>
<body>

    <h1>Lista de Livros</h1>

    <p>
        <a href="{{ url_for('pagina_novo_livro') }}">Cadastrar novo livro</a>
    </p>

    {% if biblioteca %}
        <ul>
            {% for livro in biblioteca %}
                <li>
                    <strong>{{ livro.titulo }}</strong> - {{ livro.autor }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Nenhum livro cadastrado.</p>
    {% endif %}

</body>
</html>
